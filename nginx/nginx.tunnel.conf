# Конфиг nginx для запуска за туннелем (Cloudflare Tunnel, ngrok и т.п.).
#
# TLS в этом случае терминирует туннель, а до nginx запрос доходит обычным http.
# Поэтому здесь нет редиректа на https: с ним получилась бы петля —
# туннель отдаёт https, форвардит http, nginx отправляет обратно на https.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # туннель снаружи всегда https — говорим об этом backend-у
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # опубликованные сайты: https://host/s/<site_id>
    location /s/ {
        set $site_upstream http://backend:8000;
        proxy_pass $site_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # картинки конструктора: https://host/u/<file>
    location /u/ {
        set $upload_upstream http://backend:8000;
        proxy_pass $upload_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
        set $health_upstream http://backend:8000;
        proxy_pass $health_upstream/health;
        access_log off;
    }

    location / {
        root /var/www/miniapp;
        try_files $uri $uri/ /index.html;
    }
}
