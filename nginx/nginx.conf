# Nginx перед backend-ом: TLS, отдача Mini App и проксирование /api.
# Telegram требует https для Mini App, поэтому сертификаты обязательны в бою.

# Внутренний DNS Docker: имя backend резолвится на каждый запрос, а не один раз
# при старте. Иначе после пересоздания контейнера backend nginx держит старый IP
# и отвечает 502, пока его не перезапустят вручную.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # ACME-челлендж для выпуска сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # API backend-а
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        set $health_upstream http://backend:8000;
        proxy_pass $health_upstream/health;
        access_log off;
    }

    # Статика Mini App (сборка Разработчика B кладётся в ./frontend/dist)
    location / {
        root /var/www/miniapp;
        try_files $uri $uri/ /index.html;
    }
}
